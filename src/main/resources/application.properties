# Application
spring.application.name=Smart Resume Screener
server.port=8080

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/smart_resume_screener
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 development console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Resume upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Thymeleaf
spring.thymeleaf.cache=false

# Resume storage
app.upload.directory=uploads
app.allowed-file-types=application/pdf,text/plain
app.maximum-resume-size-bytes=10485760

# Ollama LLM configuration
app.ai.enabled=true
app.ai.base-url=http://localhost:11434
app.ai.model=qwen2.5:3b
app.ai.connect-timeout-seconds=5
app.ai.request-timeout-seconds=180

# Candidate screening
app.screening.shortlist-threshold=7